@startuml
title Motion: the digital twin's side

hide empty members
skinparam shadowing false
skinparam objectBackgroundColor #FDFDFD
skinparam ArrowFontSize 17
skinparam objectFontSize 19
skinparam objectStereotypeFontSize 16

together {
    object "leftStickControl : ThumbStickControl" as leftStickControl <<on-screen stick>>
    object "rightStickControl : ThumbStickControl" as rightStickControl <<on-screen stick>>
}
object "rosNode : QRos2Node" as rosNode <<node>>
object "dogzillad\non the robot" as dog <<robot>>
object "ctl : DogzillaControl" as ctl
object "robotRoot : Dogzilla" as robotRoot <<3D model>>
together {
    object "cmdVel : TwistPublisher" as cmdVel <<publisher>>
    object "body_pose_command : PoseStampedPublisher" as body_pose_command <<publisher>>
}
together {
    object "jointStateSubscriber : JointStateSubscriber" as jointStateSubscriber <<subscriber>>
    object "poseSubscriber : PoseStampedSubscriber" as poseSubscriber <<subscriber>>
}

leftStickControl ..> cmdVel : <size:26>①</size> <color:green>walkSpeed ← axes.y</color>\n<color:green>turnSpeed ← axes.x</color>
rightStickControl ..> cmdVel : <size:26>②</size> <color:green>strafeSpeed ← axes.x</color>
rightStickControl ..> body_pose_command : <size:26>③</size> <color:green>pitch ← axes.y</color>
cmdVel ..> dog : <size:26>④</size> <color:blue>autoPublish cmd_vel</color>
body_pose_command ..> dog : <size:26>⑤</size> <color:blue>autoPublish body_pose/command</color>
dog ..> jointStateSubscriber : <size:26>⑥</size> <color:blue>joint_states, body_pose/state</color>
jointStateSubscriber ..> ctl : <size:26>⑦</size> updateJointState(name, position)
ctl ..> robotRoot : <size:26>⑧</size> <color:green>rotation ← lfHipJointAngle</color>\n<color:green>(+11 more, in Dogzilla.qml)</color>
dog ..> poseSubscriber : <size:26>⑨</size> <color:blue>body_pose/state</color>
poseSubscriber ..> robotRoot : <size:26>⑩</size> <color:green>rotation ← pose.orientation</color>\n<color:green>.toQuaternion()</color>
@enduml

