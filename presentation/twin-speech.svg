@startuml
title Speech: the digital twin's side

hide empty members
skinparam shadowing false
skinparam objectBackgroundColor #FDFDFD
skinparam ArrowFontSize 17
skinparam objectFontSize 19
skinparam objectStereotypeFontSize 16

together {
    object "pttH : TapHandler" as pttH <<press to talk>>
    object "ptt : Rectangle" as ptt <<button>>
    object "panel : ControlPanel" as panel <<chat + mixer>>
}
object "listenPublisher : BoolPublisher" as listenPublisher <<publisher>>
object "speakAction : SpeakActionClient" as speakAction <<action client>>
object "stopSpeech : TriggerServiceClient" as stopSpeech <<service client>>
object "speechStateSub : StringSubscriber" as speechStateSub <<subscriber>>
object "msgSub : ChatMessageSubscriber" as msgSub <<subscriber>>
object "rosNode : QRos2Node" as rosNode <<node>>
object "dogzillad:\nmic, whisper, LLM, TTS" as dog <<robot>>

pttH ..> listenPublisher : <size:26>①</size> publish(pressed)
listenPublisher ..> dog : <size:26>②</size> <color:blue>speech/listen</color>
panel ..> speakAction : <size:26>③</size> sendGoal({text, useLlm})\nSpeak = verbatim, Send = via LLM
panel ..> stopSpeech : <size:26>④</size> callService()\n(not a goal cancel: it must also\nsilence autonomous speech)
dog ..> speechStateSub : <size:26>⑤</size> <color:blue>speech/state "prep" / "listening" /</color>\n<color:blue>"transcribing"</color>
dog ..> msgSub : <size:26>⑥</size> <color:blue>speech/log ChatMessage</color>
msgSub ..> panel : <size:26>⑦</size> addChatMessage(msg)\nHEARD / SPOKEN, markdown
@enduml

