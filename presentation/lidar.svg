@startuml
title Lidar: sector scan to instanced point cloud

left to right direction
hide empty members
skinparam shadowing false
skinparam objectBackgroundColor #FDFDFD
skinparam ArrowFontSize 17
skinparam objectFontSize 19
skinparam objectStereotypeFontSize 16

object "LD06 lidar\n/dev/ttyAMA1" as lidar_hw <<firmware>>
object "dogzillad:\nLidar → LaserScanPublisher" as dog <<robot>>
object "ROS 2 graph" as ros_graph <<rmw>>
object "laserSub : LaserScanSubscriber" as laserSub <<subscriber>>
object "rosNode : QRos2Node" as rosNode <<node>>
object "instancing : LidarInstanceTable" as instancing <<QQuick3DInstancing>>
object "model : Model" as model <<3D>>

lidar_hw ..> dog : <size:26>①</size> <color:#B8860B>serial frames, one sector at a time</color>
dog ..> ros_graph : <size:26>②</size> <color:blue>sectorScanned → publish(msg)</color>\n<color:blue>on /dogzilla/.../LaserScan</color>
ros_graph ..> laserSub : <size:26>③</size> <color:blue>LaserScan</color>
laserSub ..> instancing : <size:26>④</size> <color:green>ranges ← ranges</color>\n<color:green>intensities, angleIncrement</color>
instancing ..> model : <size:26>⑤</size> <color:green>one cube instance per</color>\n<color:green>range sample</color>
@enduml

