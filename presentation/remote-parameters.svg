@startuml
title Remote parameters: mixer sliders and the engage switch

left to right direction
hide empty members
skinparam shadowing false
skinparam objectBackgroundColor #FDFDFD
skinparam ArrowFontSize 17
skinparam objectFontSize 19
skinparam objectStereotypeFontSize 16

object "panel : ControlPanel" as panel <<mixer UI>>
object "rosNode : QRos2Node" as rosNode <<node>>
object "ROS 2 graph\nparameter services +\n/parameter_events" as ros_graph <<rmw>>
object "dogzillad: Ros2.Parameter\n'audio.master', 'audio.mic',\n'motors.engaged'" as dog_param <<robot>>
object "VolumeController → PipeWire\nController → leg servos" as sinks <<effect>>
together {
    object "masterParam : QRos2RemoteParameter" as masterParam <<remote parameter>>
    object "engageParam : QRos2RemoteParameter" as engageParam <<remote parameter>>
}

panel ..> masterParam : <size:26>①</size> <color:green>value ← desiredMasterVolume</color>\n<color:green>autoApply ← masterVolumeLive</color>
masterParam ..> ros_graph : <size:26>②</size> <color:blue>set_parameters</color>\n<color:blue>(latest-wins, coalesced)</color>
ros_graph ..> dog_param : <size:26>③</size> <color:blue>valueEdited(v)</color>
dog_param ..> sinks : <size:26>④</size> volumeCtl.master = v\ncontroller.motorsEngaged = v
dog_param ..> ros_graph : <size:26>⑤</size> <color:blue>initial get_parameters,</color>\n<color:blue>then /parameter_events</color>
ros_graph ..> engageParam : <size:26>⑥</size> <color:blue>parameter event</color>
engageParam ..> panel : <size:26>⑦</size> <color:green>motorsEngaged ← reported</color>\n<color:green>(so the switch tracks the</color>\n<color:green>gamepad too)</color>
panel ..> engageParam : <size:26>⑧</size> autoApply = true\nonly once the user toggles it
@enduml

