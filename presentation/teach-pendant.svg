@startuml
title Teach pendant: jog, save, play back

left to right direction
hide empty members
skinparam shadowing false
skinparam objectBackgroundColor #FDFDFD
skinparam ArrowFontSize 17
skinparam objectFontSize 19
skinparam objectStereotypeFontSize 16

object "teachPanel : TeachPanel" as teachPanel <<pendant>>
object "ctl : DogzillaControl" as ctl <<3D joint state>>
object "motionLib : MotionLibrary" as motionLib <<persisted JSON>>
object "rosNode : QRos2Node" as rosNode <<node>>
object "motionAction : PlayMotionActionClient" as motionAction <<action client>>
object "libraryPub : StringPublisher" as libraryPub <<publisher>>
object "ROS 2 graph" as ros_graph <<rmw>>
object "dogzillad:\nPlayMotionActionServer\n→ interpolateTick() → servos" as server <<robot>>

teachPanel ..> ctl : <size:26>①</size> jog: write a joint angle
teachPanel ..> motionLib : <size:26>②</size> save the pose under a name
motionLib ..> libraryPub : <size:26>③</size> changed() → publishLibrary()
libraryPub ..> ros_graph : <size:26>④</size> <color:blue>motion/library (transient local,</color>\n<color:blue>so the dog gets it even if it</color>\n<color:blue>starts later)</color>
teachPanel ..> rosNode : <size:26>⑤</size> play(waypoints)
rosNode ..> motionAction : <size:26>⑥</size> sendGoal({trajectory, name})
motionAction ..> ros_graph : <size:26>⑦</size> <color:blue>PlayMotion goal</color>
ros_graph ..> server : <size:26>⑧</size> <color:blue>goalReceived → beginMotion()</color>
server ..> ros_graph : <size:26>⑨</size> <color:blue>feedback: progress</color>
ros_graph ..> motionAction : <size:26>⑩</size> <color:blue>feedback</color>
motionAction ..> teachPanel : <size:26>⑪</size> <color:green>progress ← feedback.progress</color>
teachPanel ..> motionAction : <size:26>⑫</size> stop() → cancelGoal()
@enduml

